# Title substrings that signal a role is too senior. Matched in the TITLE
# only (not the body) and downgrade rather than zero the score, since a
# posting can be mislabeled or an "entry level" clause elsewhere can rescue it.
seniority_exclude_keywords:
  - "senior"
  - "sr."
  - "sr"
  - "staff"
  - "principal"
  - "lead "
  - "director"
  - "head of"
  - "vp "
  - "vice president"
  - "manager"

# Titles that would otherwise trip a seniority keyword above but are, in
# practice, used at all levels (including entry-level) in the AI industry —
# e.g. "Member of Technical Staff" at OpenAI/Anthropic-style orgs is not
# reliably senior despite containing "Staff". Checked before the seniority
# keywords, as a full-title substring match.
title_seniority_exceptions:
  - "member of technical staff"

# Phrases in the body that rescue a seniority-flagged title (e.g. "Senior"
# in the title but the role is actually junior-friendly).
seniority_rescue_phrases:
  - "0-2 years"
  - "0-1 year"
  - "1-2 years"
  - "new grad"
  - "new graduate"
  - "entry level"
  - "entry-level"
  - "no prior experience"
  - "recent graduate"

