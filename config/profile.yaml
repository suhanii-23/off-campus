  name: "Suhani Jain"
  education: "Final-year B.E. student, BMSCE"
  experience_years: 0  # pre-graduation; internships count toward experience_fit, not raw years

# Free-text description embedded once and compared against every job description
# via Layer 2 (semantic similarity). Keep this honest and specific to real skills.
profile_blurb: >
  Final-year Computer Science engineering student with hands-on experience in
  machine learning, deep learning, computer vision, and NLP, including large
  language models. Comfortable building and deploying models with PyTorch,
  TensorFlow, Keras, and Scikit-learn, and building computer vision pipelines
  with OpenCV, YOLO, and CLIP. Experience fine-tuning LLMs with QLoRA and
  serving models with vLLM. Backend development experience with Python,
  FastAPI, and Flask, containerized with Docker and deployed on GCP and
  Kubernetes. Also proficient in C++, SQL, and JavaScript. Looking for
  software engineering or AI/ML internships and entry-level full-time roles.

