# Companies the pipeline actively scans every run. Each entry's ats_type +
# ats_slug has been confirmed to resolve against the live ATS API.
#
# Note: discovery/probe_ats.py rewrites this file programmatically when it
# appends a new confirmed company, which does NOT preserve hand-written
# comments below the "companies:" key (a known pyyaml limitation) — if you
# edit this file by hand, expect probe_ats.py's next run to only affect the
# list itself.
#
# Add more via `python -m discovery.probe_ats "Company Name" slug` or by
# hand — see README "How to add a company".
companies:
  - name: "Stripe"
    ats_type: "greenhouse"
    ats_slug: "stripe"
    source: "manual"

  - name: "Rigetti Computing"
    ats_type: "lever"
    ats_slug: "rigetti"
    source: "manual"

  - name: "Ramp"
    ats_type: "ashby"
    ats_slug: "ramp"
    source: "manual"

  - name: "Notion"
    ats_type: "ashby"
    ats_slug: "notion"
    source: "auto_probe"

